apiVersion: v1
kind: ConfigMap
metadata:
  name: urban-sensors-config
  namespace: urban-sensors
data:
  KAFKA_TOPIC: "urban_sensors"
  KAFKA_PARTITIONS: "3"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPARK_WINDOW_DURATION: "1 minute"
  SPARK_CHECKPOINT_LOCATION: "/tmp/spark-checkpoints/urban-sensors"
